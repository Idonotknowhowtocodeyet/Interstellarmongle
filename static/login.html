<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONGLE_OS Login</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #000;
            color: #39ff14;
            font-family: Inter, system-ui, sans-serif;
        }

        main {
            width: min(390px, calc(100% - 32px));
            padding: 30px;
            border: 1px solid #0b6b1c;
            background: #031006;
            box-shadow: 0 0 35px rgba(57, 255, 20, .14);
        }

        .mark {
            margin: 0 0 12px;
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 0 0 16px #39ff14;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
        }

        p {
            color: #75b981;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #0b6b1c;
            background: #000;
            color: #39ff14;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 1px solid #39ff14;
            background: #39ff14;
            color: #000;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
        }

        .error {
            color: #d8ff00;
        }
    </style>
</head>

<body>
    <main>
        <div class="mark">M</div>
        <h1>MONGLE_OS access</h1>
        <p>Sign in to continue.</p>
        <p class="error" id="error" hidden>Username or password is incorrect.</p>
        <form method="post" action="/login">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="submit">Sign in</button>
        </form>
    </main>
    <script>if (new URLSearchParams(location.search).has("error")) document.getElementById("error").hidden = false;</script>
</body>

</html>
